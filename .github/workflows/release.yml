name: release

# Builds the Windows installer on GitHub's machine (never on a contributor's PC) and attaches it to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Privacy check
        run: python tools/check_privacy.py
      - name: Build
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.20.0
          python -m PyInstaller --noconfirm --onedir --windowed --name ClipChimp --icon clipchimp.ico --exclude-module numpy `
            --add-data "icons;icons" --add-data "clipchimp.ico;." clipchimp.py
      - name: Installer
        shell: pwsh
        run: |
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = & $find }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc.FullName /DAppVersion=$version installer\clipchimp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Privacy check of what will be published
        run: python tools/check_privacy.py --binary dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" "dist\ClipChimp-Setup-$version.exe" `
            --title "ClipChimp $version" --notes "Download ClipChimp-Setup-$version.exe and run it."
